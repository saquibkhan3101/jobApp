<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Post List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-warning">
    <div class="container">
        <a class="navbar-brand fs-3 fw-semibold" href="/home">Saquib Job Portal</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/home">Home</a></li>
                <li class="nav-item"><a class="nav-link active" href="/viewalljobs">All Jobs</a></li>
                <li class="nav-item"><a class="nav-link" href="/addjob">Post Job</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- JOB LIST -->
<div class="container mt-5">

    <h2 class="mb-4 text-center fw-bold">Job Post List</h2>

    <form class="row g-2 mb-4" action="/viewalljobs" method="get">
        <div class="col-md-10">
            <input class="form-control" type="search" name="keyword"
                   placeholder="Search by role, description, or tech stack"
                   th:value="${keyword}">
        </div>
        <div class="col-md-2">
            <button class="btn btn-primary w-100" type="submit">Search</button>
        </div>
    </form>

    <p class="text-center text-muted" th:if="${#lists.isEmpty(jobPosts)}">
        No jobs found. Try another search or add a new job.
    </p>

    <div class="row row-cols-1 row-cols-md-2 g-4">

        <!-- Thymeleaf loop replaces JSTL -->
        <div class="col" th:each="jobPost : ${jobPosts}">

            <div class="card border-dark bg-dark text-white">

                <div class="card-body">

                    <h5 class="card-title" th:text="${jobPost.postProfile}">Job Profile</h5>

                    <p class="card-text">
                        <strong>Job Id:</strong>
                        <span th:text="${jobPost.postId}"></span>
                    </p>

                    <p class="card-text">
                        <strong>Description:</strong>
                        <span th:text="${jobPost.postDesc}"></span>
                    </p>

                    <p class="card-text">
                        <strong>Experience Required:</strong>
                        <span th:text="${jobPost.reqExperience}"></span> years
                    </p>

                    <p class="card-text">
                        <strong>Tech Stack:</strong>
                    </p>

                    <ul>
                        <li th:each="tech : ${jobPost.postTechStack}" th:text="${tech}">Tech</li>
                    </ul>

                </div>

                <div class="card-footer text-center">
                    <a th:href="@{/job-details/{postId}(postId=${jobPost.postId})}" class="btn btn-primary btn-sm">View</a>
                    <a th:href="@{/apply/{postId}(postId=${jobPost.postId})}" class="btn btn-success btn-sm">Apply</a>
                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
