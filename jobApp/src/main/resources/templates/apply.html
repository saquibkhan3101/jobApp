<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Apply for Job</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-warning">
    <div class="container">
        <a class="navbar-brand fs-3 fw-semibold" href="/home">Saquib Job Portal</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/home">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/viewalljobs">All Jobs</a></li>
                <li class="nav-item"><a class="nav-link" href="/addjob">Post Job</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <h2 class="mb-1 text-center fw-bold">Apply for <span th:text="${jobPost.postProfile}">Job</span></h2>
            <p class="text-center text-muted mb-4">
                Job ID <span th:text="${jobPost.postId}">1</span>
            </p>

            <div class="card">
                <div class="card-body">
                    <form action="/submitApplication" method="post">
                        <input type="hidden" name="postId" th:value="${jobPost.postId}">

                        <div class="mb-3">
                            <label class="form-label" for="applicantName">Full Name</label>
                            <input type="text" class="form-control" id="applicantName" name="applicantName" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="applicantEmail">Email</label>
                            <input type="email" class="form-control" id="applicantEmail" name="applicantEmail" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="phoneNumber">Phone Number</label>
                            <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="resumeLink">Resume Link</label>
                            <input type="url" class="form-control" id="resumeLink" name="resumeLink"
                                   placeholder="https://..." required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="coverLetter">Cover Letter</label>
                            <textarea class="form-control" id="coverLetter" name="coverLetter" rows="4" required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Submit Application</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
