<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Application Submitted</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-warning">
    <div class="container">
        <a class="navbar-brand fs-3 fw-semibold" href="/home">Saquib Job Portal</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/home">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/viewalljobs">All Jobs</a></li>
                <li class="nav-item"><a class="nav-link" href="/addjob">Post Job</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card border-success">
                <div class="card-body text-center">
                    <h2 class="fw-bold text-success mb-3">Application Submitted</h2>
                    <p class="mb-1">
                        Thank you, <strong th:text="${jobApplication.applicantName}">Applicant</strong>.
                    </p>
                    <p class="text-muted">
                        Your application for
                        <strong th:text="${jobPost != null ? jobPost.postProfile : 'this job'}">Job</strong>
                        has been received.
                    </p>
                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <a class="btn btn-primary" href="/viewalljobs">Browse More Jobs</a>
                        <a class="btn btn-outline-secondary" href="/home">Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
