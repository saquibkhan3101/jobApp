<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Saquib Job Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style1.css">

    <style>
        h2 { font-size: 16px; margin-bottom: 5px; }
        p { font-size: 12px; margin: 0; }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-warning">
    <div class="container">
        <a class="navbar-brand fs-1 fw-medium" href="#">Saquib Job Portal Web App</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="home">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="viewalljobs">All Jobs</a></li>
                <li class="nav-item"><a class="nav-link" href="https://www.naukri.com/mnjuser/homepage">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- FORM -->
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card">
                <div class="card-body">

                    <h2 class="mb-3 text-center fs-3 fw-bold">
                        Post a new Job
                    </h2>

                    <!-- THYMELEAF FORM (replaces JSP form:form) -->
                    <form action="handleForm" method="post">

                        <div class="mb-2">
                            <label class="form-label">Post ID</label>
                            <input type="text" class="form-control" name="postId" required>
                        </div>

                        <div class="mb-2">
                            <label class="form-label">Post Profile</label>
                            <input type="text" class="form-control" name="postProfile" required>
                        </div>

                        <div class="mb-2">
                            <label class="form-label">Post Description</label>
                            <textarea class="form-control" name="postDesc" rows="2" required></textarea>
                        </div>

                        <div class="mb-2">
                            <label class="form-label">Required Experience</label>
                            <input type="number" class="form-control" name="reqExperience" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Tech Stack</label>

                            <select multiple class="form-select" name="postTechStack" required>

                                <option value="Java">Java</option>
                                <option value="JavaScript">JavaScript</option>
                                <option value="Swift">Swift</option>
                                <option value="TypeScript">TypeScript</option>
                                <option value="Go">Go</option>
                                <option value="Kotlin">Kotlin</option>
                                <option value="Rust">Rust</option>
                                <option value="PHP">PHP</option>
                                <option value="HTML5">HTML5</option>
                                <option value="CSS3">CSS3</option>
                                <option value="GraphQL">GraphQL</option>
                                <option value="Raspberry Pi">Raspberry Pi</option>
                                <option value="Arduino">Arduino</option>
                                <option value="IoT (Internet of Things)">IoT</option>
                                <option value="Apache Kafka">Apache Kafka</option>
                                <option value="Docker">Docker</option>
                                <option value="Kubernetes">Kubernetes</option>
                                <option value="AWS">AWS</option>
                                <option value="Azure">Azure</option>
                                <option value="DevOps">DevOps</option>

                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Submit
                        </button>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
